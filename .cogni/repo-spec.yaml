# Node Template — repo-spec
#
# Identity for the hub's node-template deployment; node_id MUST match
# infra/catalog/node-template.yaml. Forks renaming this scaffold MUST
# regenerate both UUIDs:
#   node_id:  openssl rand -hex 16 | sed 's/\(.\{8\}\)\(.\{4\}\)\(.\{4\}\)\(.\{4\}\)\(.\{12\}\)/\1-\2-\3-\4-\5/'
#   scope_id: uuidv5(node_id, "default")
# See docs/spec/identity-model.md, docs/spec/multi-node-tenancy.md.

schema_version: "0.1.4"

node_id: "f97f68f2-8406-4a3b-b5a9-d579b779f19d"
scope_id: "24971774-c0e2-5fa5-a11c-df89c88a9baf"
scope_key: "default"

intent:
  name: beacon
  hook: "Share your message, attract your people"
  mission: "Help people and nodes broadcast their message, attract the community they want, and measure their audience. Distribution is everything."
  brand:
    icon: "RadioTower"
    color: "#f59e0b"

governance:
  dao_contract: "0xdd1776f660e4cf46b2fb723196242db4d45e8b58"
  plugin_contract: "0xc6808d775b53229116547112db1f0394888d1abf"
  signal_contract: "0xbc20b71e4d33e12e5dcf65e8fc665d62188abaa8"
  chain_id: "8453"
  base_url: "https://proposal.cognidao.org"

gates:
  - type: review-limits
    id: review_limits
    with:
      max_changed_files: 50
      max_total_diff_kb: 1500
  - type: ai-rule
    with:
      rule_file: pr-syntropy-coherence.yaml
  - type: ai-rule
    with:
      rule_file: patterns-and-docs.yaml
  - type: ai-rule
    with:
      rule_file: repo-goal-alignment.yaml
